name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify -Pintegration
        working-directory: backend
      - run: java load/OrderRace.java --self-test
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: docker compose up -d --build backend frontend
      - run: curl --fail --retry 60 --retry-delay 2 --retry-all-errors http://localhost:18080/actuator/health
      - name: Wait for demo data readiness
        run: >-
          curl --fail --retry 60 --retry-delay 2 --retry-all-errors
          -H "Content-Type: application/json"
          --data '{"login":"admin","password":"Password123"}'
          http://localhost:18080/api/auth/login
      - run: npm run test:e2e
        working-directory: frontend
      - if: always()
        run: docker compose logs backend frontend --tail 200
      - if: always()
        run: docker compose down -v
