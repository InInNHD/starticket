services:
  backend:
    image: ghcr.io/ininnhd/starticket-backend:${STARTICKET_VERSION:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  frontend:
    image: ghcr.io/ininnhd/starticket-frontend:${STARTICKET_VERSION:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  mysql:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  rabbitmq:
    restart: unless-stopped
