groups:
  - name: starticket
    rules:
      - alert: StarTicketBackendDown
        expr: up{job="starticket"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: StarTicket 后端不可用

      - alert: StarTicketHttp5xx
        expr: sum(rate(http_server_requests_seconds_count{job="starticket",status=~"5.."}[5m])) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: StarTicket 5xx 错误率持续升高

      - alert: StarTicketOutboxDead
        expr: starticket_outbox_dead{job="starticket"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Outbox 出现死亡事件

      - alert: StarTicketOutboxBacklog
        expr: starticket_outbox_pending{job="starticket"} > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Outbox 待发布事件持续积压

      - alert: StarTicketRedisDegraded
        expr: sum(increase(starticket_redis_degraded_total{job="starticket"}[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Redis 操作发生降级
